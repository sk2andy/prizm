name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    steps:
      - name: Check semver format
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not valid semver (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

  test:
    name: Test
    runs-on: macos-26
    needs: validate-tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select --switch $(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Create signing config
        run: cp Prizm/LocalConfig.xcconfig.template Prizm/LocalConfig.xcconfig

      - name: Run tests
        run: |
          xcodebuild test \
            -project "Prizm/Prizm.xcodeproj" \
            -scheme "Prizm" \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || exit ${PIPESTATUS[0]}

  build-dmg:
    name: Build & Package DMG
    runs-on: macos-26
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select --switch $(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Create signing config (unsigned release build)
        run: cp Prizm/LocalConfig.xcconfig.template Prizm/LocalConfig.xcconfig

      - name: Build Release (no signing)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild \
            -project "Prizm/Prizm.xcodeproj" \
            -scheme "Prizm" \
            -configuration Release \
            -derivedDataPath build/ \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build | xcpretty || exit ${PIPESTATUS[0]}

      - name: Create DMG
        run: |
          APP="build/Build/Products/Release/Luma.app"
          VERSION="${GITHUB_REF_NAME}"
          DMG_NAME="Luma-${VERSION}.dmg"

          STAGING="dmg-staging"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/Luma.app"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "Luma ${VERSION}" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

          echo "DMG_PATH=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Upload DMG to GitHub Release (draft)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: ${{ env.DMG_PATH }}
          draft: true
          generate_release_notes: true

      # GitHub's generated notes add " by @<author>" to every pull request line, and
      # `.github/release.yml` cannot hide it (its `exclude.authors` drops the whole entry).
      # The maintainer does not want their handle in release notes, so strip it from the
      # draft. Other contributors keep their credit, and the "New Contributors" section is
      # untouched. The release stays a draft; the maintainer edits and publishes it.
      - name: Remove the maintainer handle from the draft notes
        # Cosmetic only: failure must not invalidate the draft release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json body -q .body > release-notes.md
          # BSD sed (macOS runner): -i needs an explicit empty backup suffix.
          sed -i '' "s/ by @${OWNER} in / in /" release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
